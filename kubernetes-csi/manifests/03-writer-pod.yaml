apiVersion: v1
kind: Pod
metadata:
  name: s3-writer
  namespace: csi-s3-demo
spec:
  containers:
    - name: writer
      image: busybox:1.37.0
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          while true; do
            date -Iseconds >> /data/events.log
            sleep 10
          done
      volumeMounts:
        - name: s3-data
          mountPath: /data
  volumes:
    - name: s3-data
      persistentVolumeClaim:
        claimName: s3-data
