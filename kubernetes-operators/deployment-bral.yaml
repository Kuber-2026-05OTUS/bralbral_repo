---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-operator          
  namespace: default           
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-operator
  template:
    metadata:
      labels:
        app: mysql-operator
    spec:
      serviceAccountName: mysql-operator
      containers:
        - name: operator
          image: bral-operator:latest
          imagePullPolicy: IfNotPresent